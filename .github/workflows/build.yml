name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Kopyala
      uses: actions/checkout@v4

    - name: Java Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Android NDK ve SDK Ayarla
      uses: android-actions/setup-android@v3

    - name: SDL2 ve Kütüphaneleri Hazırla
      run: |
        echo "SDL2, SDL_image ve SDL_mixer için derleme ortamı hazırlanıyor..."
        # Buraya projenin yapılandırmasına göre derleme komutları eklenecek
